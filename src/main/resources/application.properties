spring.application.name=beep-job-portal

# Local secrets live in .env (git-ignored). On Render they come from real env vars.
spring.config.import=optional:file:.env[.properties],classpath:sources.yml

# Secret for POST /api/admin/refresh. Empty = endpoint disabled.
app.admin-token=${ADMIN_TOKEN:}

server.port=${PORT:8080}

# ---------- Database ----------
# Defaults point to the local Docker Postgres (docker-compose.yml).
# In production set DB_URL / DB_USER / DB_PASSWORD to the Neon values.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/jobportal}
spring.datasource.username=${DB_USER:jobportal}
spring.datasource.password=${DB_PASSWORD:jobportal}
# Small pool: Neon free tier and Render 512 MB both prefer few connections
spring.datasource.hikari.maximum-pool-size=5
# Fail fast instead of hanging: the Postgres driver's socket timeout is infinite by default
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=60
spring.datasource.hikari.data-source-properties.loginTimeout=15

# Flyway owns the schema; Hibernate only checks that entities match it
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- LLM (Spring AI, OpenAI-compatible) ----------
# Switch model/provider by changing these env vars only, no code change.
spring.ai.openai.api-key=${LLM_API_KEY:not-set}
spring.ai.openai.base-url=${LLM_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${LLM_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
