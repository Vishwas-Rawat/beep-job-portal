# LLM tagging settings. Model/provider come from LLM_* env vars (application.properties).
tagging:
  enabled: true
  batch-size: 20               # posts per LLM call: fewer calls, less repeated prompt overhead
  description-chars: 800       # send only the start of the description
  max-attempts: 2              # try a post twice, then give up and use the rule-based fallback
  max-jobs-per-run: 3000
  delay-between-batches-ms: 4000   # free tier rate limits are not published; stay under ~15 calls/min
  reasoning-effort: ""         # e.g. "low" to cap thinking tokens; empty = provider default

  # Official price per 1M tokens (USD), Gemini 3.5 Flash-Lite, paid standard tier.
  # Source: https://ai.google.dev/gemini-api/docs/pricing (checked 16 Nov 2026).
  # Free tier is $0, but we report what it WOULD cost at paid rates.
  price-input-per-million: 0.30
  price-output-per-million: 2.50

  # Fixed list: the model must pick one of these, so it can't invent categories.
  roles:
    - Software Engineer (Backend)
    - Software Engineer (Frontend)
    - Full Stack
    - Mobile
    - Data Analyst
    - Data Science / ML
    - DevOps / Cloud
    - QA / Testing
    - Cybersecurity
    - Hardware / Embedded
    - UI/UX Design
    - Product
    - Marketing
    - Sales / BD
    - Operations
    - HR
    - Finance / Accounting
    - Content
    - Customer Support
    - Other
