# Render Blueprint: Render reads this file and creates the web service.
services:
  - type: web
    name: beep-jobs
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India; put Neon in Singapore too
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL            # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false            # sync:false = Render asks you for the value, never stored in git
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_TOKEN       # Render generates a random secret
        generateValue: true
      - key: CAREERJET_API_KEY # partner key; works only from IPs declared in Careerjet
        sync: false
      # LLM via Gemini's OpenAI-compatible API. Set all four (an empty value overrides defaults).
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_COMPLETIONS_PATH
        value: /chat/completions
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
